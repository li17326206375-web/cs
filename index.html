<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="赶紧tmd上号-三角洲" />
    <meta name="description" content="赶紧tmd上号-三角洲" />
    <meta name="robots" content="index, follow" />
    <title>赶紧tmd上号-三角洲</title>
    <style>
      :root {
        --bg-1: #070b14;
        --bg-2: #101827;
        --text: #f7f7f7;
        --accent: #ff4d4f;
        --accent-2: #ffbf00;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(255, 77, 79, 0.18), transparent 35%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 32px 20px;
        width: min(90vw, 900px);
      }

      .badge {
        display: inline-block;
        margin-bottom: 20px;
        padding: 8px 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #d7dce5;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 7vw, 6rem);
        line-height: 1.1;
        font-weight: 900;
        letter-spacing: 0.06em;
      }

      .highlight {
        display: inline-block;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 28px rgba(255, 77, 79, 0.3);
      }

      .subtitle {
        margin-top: 18px;
        font-size: clamp(0.9rem, 2vw, 1.25rem);
        color: rgba(255,255,255,0.8);
        letter-spacing: 0.1em;
      }

      .glow {
        width: 220px;
        height: 220px;
        margin: 28px auto 0;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,77,79,0.9), rgba(255,77,79,0.15) 36%, transparent 68%);
        filter: blur(10px);
        opacity: 0.9;
      }

      @media (max-width: 640px) {
        .container { padding: 24px 14px; }
        h1 { letter-spacing: 0.04em; }
        .subtitle { letter-spacing: 0.05em; }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="badge">Delta Force</div>
      <h1><span class="highlight">赶紧tmd上号</span> - 三角洲</h1>
      <div class="subtitle">READY · JOIN · FIGHT</div>
      <div class="glow" aria-hidden="true"></div>
    </main>
  </body>
</html>
